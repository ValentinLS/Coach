<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Plan Entrenamiento 2026 PWA</title>
<style>
:root {
  --bg: #f4f7fb;
  --panel: #ffffff;
  --text: #102033;
  --muted: #5f6f82;
  --line: #d5dee8;
  --header: #ffffff;
  --header-text: #102033;
  --button: #102033;
  --button-text: #ffffff;
  --button-alt: #edf2f7;
  --accent: #e7ad00;
  --swim: #7ed8ef;
  --bike: #9de097;
  --run: #ffd1bd;
  --strength: #e6c0e8;
  --mobility: #dad1ff;
  --race: #ffea64;
  --rest: #e5e7eb;
  --radius: 14px;
}
[data-theme="dark"] {
  --bg: #09121d;
  --panel: #111d2b;
  --text: #eef5ff;
  --muted: #aebccc;
  --line: #314157;
  --header: #0e1a28;
  --header-text: #eef5ff;
  --button: #dfe9f5;
  --button-text: #0b1522;
  --button-alt: #182739;
  --accent: #f3c43b;
  --swim: #157fa4;
  --bike: #367b42;
  --run: #9a5939;
  --strength: #7b4d83;
  --mobility: #5d549a;
  --race: #b79a00;
  --rest: #4a5565;
}
* { box-sizing: border-box; }
body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
header { position: sticky; top:0; z-index:20; background: var(--header); color:var(--header-text); border-bottom:1px solid var(--line); }
.toolbar { max-width:1480px; margin:0 auto; padding:12px 18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button, select { border:1px solid var(--line); background:var(--button-alt); color:var(--text); padding:9px 11px; border-radius:10px; font-weight:750; cursor:pointer; }
button:hover, select:hover { border-color:var(--accent); }
.primary-btn { background:var(--button); color:var(--button-text); border-color:var(--button); }
.clear-btn { background:#dc2626; color:#fff; border-color:#dc2626; }
main { max-width:1480px; margin:0 auto; padding:18px 18px 52px; }
.grid-top { display:grid; grid-template-columns:1fr; gap:14px; align-items:start; margin-bottom:14px; }
.grid-top.week-mode { grid-template-columns:1fr; }
.side { display:none !important; }
.grid-top.week-mode .side { display:block; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; }
.panel-body { padding:14px; }
.kpis { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:10px; }
.kpi { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
.kpi .label { color:var(--muted); font-size:.76rem; text-transform:uppercase; letter-spacing:.07em; }
.kpi .value { font-size:1.12rem; font-weight:900; margin-top:4px; line-height:1.2; }
.kpi small { display:block; margin-top:4px; font-size:.75rem; }
.calendar-wrap { margin-top:0; }
.calendar-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 15px; border-bottom:1px solid var(--line); }
.calendar-head h2 { margin:0; font-size:1.08rem; }
.month-grid { display:grid; grid-template-columns: repeat(7, 1fr); }
.dow { background:#102033; color:white; font-weight:850; text-align:center; padding:9px 4px; font-size:.8rem; border-right:1px solid #23364b; }
[data-theme="dark"] .dow { background:#0a1522; border-color:#26364a; }
.dow:nth-child(7n) { border-right:none; }
.day { min-height:128px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; background:var(--panel); }
.day:nth-child(7n) { border-right:none; }
.day.out { background:var(--bg); opacity:1; }
.day.today { outline:3px solid var(--accent); outline-offset:-3px; }
.day-num { font-weight:900; font-size:.86rem; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; }
.cards { display:flex; flex-direction:column; gap:4px; }
.wcard { position:relative; display:block; width:100%; border:1px solid rgba(0,0,0,.16); border-left:5px solid rgba(0,0,0,.38); border-radius:9px; padding:6px 6px 6px 24px; font-size:.75rem; text-align:left; color:#132033; background:var(--rest); cursor:pointer; line-height:1.15; }
[data-theme="dark"] .wcard { color:#f7fbff; border-color:rgba(255,255,255,.18); }
.wcard small { color:rgba(15,32,51,.75); }
[data-theme="dark"] .wcard small { color:rgba(255,255,255,.82); }
.wcard .check { position:absolute; left:6px; top:7px; width:13px; height:13px; border:1px solid rgba(0,0,0,.32); border-radius:3px; background:rgba(255,255,255,.72); }
.wcard.done { opacity:.42; filter:saturate(.72); text-decoration:none; }
.wcard.done:hover, .wcard.done:focus-visible { opacity:.78; filter:saturate(.9); }
.wcard.done .check::after { content:'✓'; position:absolute; top:-4px; left:1px; font-weight:900; font-size:14px; }
.swim { background:var(--swim); } .bike { background:var(--bike); } .run { background:var(--run); } .strength { background:var(--strength); } .mobility { background:var(--mobility); } .race { background:var(--race); } .rest { background:var(--rest); }
.wcard.actual.done { text-decoration:none; }
.wcard.actual .check::after { content:'✓'; position:absolute; top:-4px; left:1px; font-weight:900; font-size:14px; }
.wcard.actual { border-style:solid; }
.annual-month-link { cursor:pointer; transition: transform .12s ease, border-color .12s ease; }
.annual-month-link:hover { border-color:var(--accent); transform: translateY(-1px); }
.month-grid.clickable-weeks .day { cursor:pointer; }
.month-grid.clickable-weeks .day:hover { outline:2px solid var(--accent); outline-offset:-2px; }
.mini-month .day { height:96px; min-height:96px; overflow:hidden; }
.mini-month .cards { max-height:68px; overflow-y:auto; scrollbar-width:thin; }

.annual { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:14px; align-items:stretch; grid-auto-rows:1fr; }
.annual > section { min-width:0; height:100%; display:flex; flex-direction:column; }
.annual > section > .calendar-head { flex:0 0 auto; }
.annual > section > .mini-month { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.annual > section .month-grid { width:100%; grid-template-columns: repeat(7, minmax(0,1fr)); }
.annual > section .dow, .annual > section .day { min-width:0; }
.mini-month .month-grid { font-size:.72rem; }
.mini-month .day { min-height:90px; padding:4px; }
.mini-month .wcard { font-size:.64rem; padding:4px 4px 4px 18px; border-radius:7px; }
.mini-month .wcard .check { width:10px; height:10px; left:4px; top:5px; }
.annual .mini-month .cards { gap:3px; max-height:70px; overflow-y:auto; scrollbar-width:thin; }
.annual .wcard.annual-card { min-height:22px; display:flex; align-items:center; gap:4px; justify-content:flex-start; padding:4px 5px 4px 19px; border-left:0; border-radius:7px; font-size:.68rem; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:clip; }
.annual .wcard.annual-card .check { width:10px; height:10px; left:4px; top:50%; transform:translateY(-50%); }
.annual .wcard.annual-card.done .check::after { top:-5px; left:1px; font-size:13px; }
.annual .wcard.annual-card .sport-icon { flex:0 0 auto; font-size:.86rem; line-height:1; }
.annual .wcard.annual-card .distance-short { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; font-weight:900; }
.annual .wcard.annual-card.done { text-decoration:none; }
.week-view { display:grid; grid-template-columns: repeat(7, 1fr); gap:10px; padding:14px; }
.week-col { border:1px solid var(--line); border-radius:14px; min-height:420px; background:var(--panel); overflow:hidden; }
.week-col h3 { margin:0; padding:10px; background:#102033; color:#fff; font-size:.88rem; }
[data-theme="dark"] .week-col h3 { background:#0a1522; }
.week-col .date-label { font-size:.76rem; opacity:.76; font-weight:500; }
.week-col .cards { padding:8px; }
.modal { display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); align-items:center; justify-content:center; padding:18px; }
.modal.open { display:flex; }
.modal-card { width:min(760px, 100%); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; }
.modal-head { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:start; }
.modal-head h2 { margin:0; font-size:1.15rem; }
.modal-body { padding:18px; line-height:1.55; }
.meta-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin:12px 0; }
.meta { border:1px solid var(--line); border-radius:12px; padding:10px; }
.meta .label { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; }
.meta .value { font-weight:900; margin-top:4px; }
.close { background:var(--button-alt); color:var(--text); border:1px solid var(--line); }
.complete-btn { background:#16a34a; color:white; border:0; }
small { color:var(--muted); }
@media (max-width: 1200px) { .annual { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 1100px) { .grid-top.week-mode { grid-template-columns:1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } .week-view { grid-template-columns:1fr; } .week-col { min-height:auto; } }
@media (max-width: 820px) { .annual { grid-template-columns:1fr; } }
@media (max-width: 760px) { main { padding:12px 10px 44px; } .toolbar { gap:7px; padding:10px; } button, select { padding:8px 9px; } .month-grid { grid-template-columns: repeat(7, minmax(38px,1fr)); } .day { min-height:92px; padding:3px; } .dow { font-size:.7rem; } .wcard { font-size:.66rem; padding:4px 4px 4px 18px; } .wcard .check { width:10px; height:10px; left:4px; top:5px; } .meta-grid { grid-template-columns: repeat(2,1fr); } .kpis { grid-template-columns:1fr 1fr; } }
/* PWA/iPhone safe-area support */
html { -webkit-text-size-adjust: 100%; }
button, select, .wcard { touch-action: manipulation; }
@supports (padding: max(0px)) {
  body { min-height: 100dvh; }
  header { padding-top: env(safe-area-inset-top); }
  main {
    padding-left: max(18px, env(safe-area-inset-left));
    padding-right: max(18px, env(safe-area-inset-right));
    padding-bottom: calc(52px + env(safe-area-inset-bottom));
  }
  @media (max-width: 760px) {
    main {
      padding-left: max(10px, env(safe-area-inset-left));
      padding-right: max(10px, env(safe-area-inset-right));
      padding-bottom: calc(44px + env(safe-area-inset-bottom));
    }
  }
}
@media (display-mode: standalone) {
  body { overscroll-behavior-y: contain; }
}

  const clickClass = mini ? '' : ' clickable-weeks';
  let html = `<div class="${mini?'mini-month ':''}"><div class="month-grid${clickClass}">`;
  dows.forEach(d => html += `<div class="dow">${d}</div>`);
  for(let i=0;i<42;i++) {
    const d = addDays(start,i); const ds = localIsoDate(d);
    const outside = d.getMonth() !== month;
    const today = ds === PLAN.metadata.created;
    const weekStart = localIsoDate(mondayOf(d));
    const weekAttr = mini ? '' : ` data-week-start="${weekStart}"`;
    html += `<div class="day ${outside?'out':''} ${today?'today':''}"${weekAttr}><div class="day-num"><span>${d.getDate()}</span></div><div class="cards">`;
    workoutsOn(ds).forEach(w => html += card(w, mini));
    html += `</div></div>`;
  }
  html += `</div></div>`;
  return html;
}
function renderAnnual() {
  const cal = document.getElementById('calendar');
  document.getElementById('calendarTitle').textContent = 'Vista anual · enero-octubre 2026';
  let html = '<div class="annual panel-body">';
  for(let m=0;m<=9;m++) {
    const label = months[m][0].toUpperCase()+months[m].slice(1);
    html += `<section class="panel mini-month annual-month-link" data-month="${m}" tabindex="0" role="button" aria-label="Abrir ${label} 2026"><div class="calendar-head"><h2>${label} 2026</h2></div>${renderMonth(2026,m,true)}</section>`;
  }
  html += '</div>';
  cal.innerHTML = html;
}
function renderMonthly() {
  document.getElementById('calendarTitle').textContent = `${months[currentMonth.getMonth()][0].toUpperCase()+months[currentMonth.getMonth()].slice(1)} ${currentMonth.getFullYear()}`;
  document.getElementById('calendar').innerHTML = renderMonth(currentMonth.getFullYear(), currentMonth.getMonth());
}
function weekSummaryFor(weekStart) {
  return PLAN.weekly_summaries.find(s => s.week_start === weekStart) || null;
}
function dayMonthLabel(d) {
  return `${d.getDate()} ${months[d.getMonth()]}`;
}
function weekLabelFromStart(weekStart) {
  const ws = parseLocalDate(weekStart);
  const summary = weekSummaryFor(weekStart);
  if (summary) return summary.label;
  return `${dayMonthLabel(ws)} - ${dayMonthLabel(addDays(ws, 6))}`;
}
function weekPhaseFromStart(weekStart) {
  const summary = weekSummaryFor(weekStart);
  if (summary) return summary.phase || 'Activación';
  const ws = parseLocalDate(weekStart);
  return ws < planStartDate ? 'Actividad registrada' : 'Semana sin resumen';
}
function renderWeekly() {
  const ws = parseLocalDate(currentWeek);
  document.getElementById('calendarTitle').textContent = `Semana ${weekLabelFromStart(currentWeek)} · ${weekPhaseFromStart(currentWeek)}`;
  let html = '<div class="week-view">';
  for(let i=0;i<7;i++) {
    const d = addDays(ws,i), ds = localIsoDate(d);
    html += `<div class="week-col"><h3>${dows[i]} <span class="date-label">${d.getDate()}/${d.getMonth()+1}</span></h3><div class="cards">`;
    const arr = workoutsOn(ds);
    if(!arr.length) html += '<small style="padding:8px;display:block">Sin sesión</small>';
    arr.forEach(w => html += card(w));
    html += '</div></div>';
  }
  html += '</div>';
  document.getElementById('calendar').innerHTML = html;
}
function renderWeekSummary() {
  const summary = PLAN.weekly_summaries.find(s => s.week_start === currentWeek) || PLAN.weekly_summaries[0];
  const total = summary.run_hours + summary.bike_hours + summary.swim_hours + summary.strength_hours + summary.mobility_hours || 1;
  document.getElementById('weekSummary').innerHTML = `<div class="summary-card">
    <strong>${summary.label}</strong><br><small>${summary.phase || 'Activación'}</small>
    <div class="bar"><span class="run" style="width:${summary.run_hours/total*100}%"></span><span class="bike" style="width:${summary.bike_hours/total*100}%"></span><span class="swim" style="width:${summary.swim_hours/total*100}%"></span><span class="strength" style="width:${summary.strength_hours/total*100}%"></span></div>
    <div class="side-row"><span>Total</span><strong>${summary.total_hours} h</strong></div>
    <div class="side-row"><span>Carrera</span><strong>${summary.run_hours} h · ${summary.run_km} km</strong></div>
    <div class="side-row"><span>Bici</span><strong>${summary.bike_hours} h · ${summary.bike_km} km</strong></div>
    <div class="side-row"><span>Natación</span><strong>${summary.swim_hours} h · ${summary.swim_km} km</strong></div>
    <div class="side-row"><span>Fuerza/mov.</span><strong>${(summary.strength_hours+summary.mobility_hours).toFixed(1)} h</strong></div>
    <div class="side-row"><span>TSS estimado</span><strong>${summary.estimated_tss}</strong></div>
  </div>`;
}
function clampDate(d, min, max) {
  if (d < min) return new Date(min);
  if (d > max) return new Date(max);
  return new Date(d);
}
function endOfMonthDate(d) { return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function inDateRange(ds, start, end) {
  const d = parseLocalDate(ds);
  return d >= start && d <= end;
}
function kmFromWorkout(w) {
  if (w.distance_m) return Number(w.distance_m) / 1000;
  if (w.distance_km) return Number(w.distance_km);
  return 0;
}
function addDiscipline(t, sport, km, min) {
  if (sport === 'run') { t.runKm += km || 0; t.runMin += min || 0; }
  if (sport === 'bike') { t.bikeKm += km || 0; t.bikeMin += min || 0; }
  if (sport === 'swim') { t.swimKm += km || 0; t.swimMin += min || 0; }
}
function addRaceSplits(t, w) {
  const title = (w.title || '').toLowerCase();
  if (title.includes('half triatlón') || title.includes('half triatlon')) {
    addDiscipline(t, 'swim', 1.9, 50);
    addDiscipline(t, 'bike', 90, 205);
    addDiscipline(t, 'run', 21.1, 135);
  } else if (title.includes('triatlón') || title.includes('triatlon')) {
    addDiscipline(t, 'swim', 1.5, 35);
    addDiscipline(t, 'bike', 40, 100);
    addDiscipline(t, 'run', 10, 75);
  } else if (title.includes('maratón') || title.includes('maraton')) {
    addDiscipline(t, 'run', kmFromWorkout(w), w.duration_min || 0);
  } else if (title.includes('10k')) {
    addDiscipline(t, 'run', kmFromWorkout(w), w.duration_min || 0);
  }
}
function scopeForKpis() {
  if (view === 'week') {
    const start = parseLocalDate(currentWeek);
    return { start, end: addDays(start, 6), scopeLabel: 'Semana' };
  }
  if (view === 'month') {
    const start = clampDate(new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1), startDate, endDate);
    const end = clampDate(endOfMonthDate(currentMonth), startDate, endDate);
    return { start, end, scopeLabel: 'Mes' };
  }
  return { start: startDate, end: endDate, scopeLabel: 'Año' };
}
function summarizeScope(start, end) {
  const totals = { runKm:0, runMin:0, bikeKm:0, bikeMin:0, swimKm:0, swimMin:0 };
  allCalendarEntries().forEach(w => {
    if (!inDateRange(w.date, start, end)) return;
    if (w.sport === 'run' || w.sport === 'bike' || w.sport === 'swim') {
      addDiscipline(totals, w.sport, kmFromWorkout(w), w.duration_min || 0);
    } else if (w.sport === 'race') {
      addRaceSplits(totals, w);
    }
  });
  return totals;
}
function fmtKm(v) {
  const n = Number(v || 0);
  return n >= 100 ? n.toFixed(0) : n.toFixed(1);
}
function fmtHoursFromMin(min) {
  return (Number(min || 0) / 60).toFixed(1);
}
function completionToToday() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (today < planStartDate) return { pct:0, doneCount:0, eligibleCount:0 };
  const cutoff = clampDate(today, planStartDate, endDate);
  const eligible = PLAN.workouts.filter(w => w.sport !== 'rest' && inDateRange(w.date, planStartDate, cutoff));
  const completed = eligible.filter(w => done[w.id]).length;
  const pct = eligible.length ? Math.round((completed / eligible.length) * 100) : 0;
  return { pct, doneCount: completed, eligibleCount: eligible.length };
}
function renderKpis() {
  const scope = scopeForKpis();
  const s = summarizeScope(scope.start, scope.end);
  const c = completionToToday();
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Km Run / Horas Run</div><div class="value">${fmtKm(s.runKm)} km / ${fmtHoursFromMin(s.runMin)} h</div><small>${scope.scopeLabel}</small></div>
    <div class="kpi"><div class="label">Km Bike / Horas Bike</div><div class="value">${fmtKm(s.bikeKm)} km / ${fmtHoursFromMin(s.bikeMin)} h</div><small>${scope.scopeLabel}</small></div>
    <div class="kpi"><div class="label">Km Swim / Horas Swim</div><div class="value">${fmtKm(s.swimKm)} km / ${fmtHoursFromMin(s.swimMin)} h</div><small>${scope.scopeLabel}</small></div>
    <div class="kpi"><div class="label">% Completados hasta hoy</div><div class="value">${c.pct}%</div><small>${c.doneCount}/${c.eligibleCount} sesiones desde el inicio</small></div>`;
}
function openWorkout(id) {
  const w = allCalendarEntries().find(x=>x.id===id); if(!w) return;
  document.getElementById('modalTitle').textContent = w.title;
  const dist = w.distance_m ? `${w.distance_m} m` : (w.distance_km ? `${w.distance_km} km` : '—');
  const actualMeta = w.actual ? `
    <div class="meta-grid"><div class="meta"><div class="label">Estado</div><div class="value">Realizada</div></div><div class="meta"><div class="label">Hora</div><div class="value">${w.start_time || '—'}</div></div><div class="meta"><div class="label">FC media/máx.</div><div class="value">${w.average_heartrate || '—'} / ${w.max_heartrate || '—'}</div></div><div class="meta"><div class="label">Potencia media/máx.</div><div class="value">${w.average_watts || '—'} / ${w.max_watts || '—'}</div></div></div>` : '';
  document.getElementById('modalBody').innerHTML = `
    <div class="meta-grid"><div class="meta"><div class="label">Fecha</div><div class="value">${fmtDate(w.date)}</div></div><div class="meta"><div class="label">Deporte</div><div class="value">${w.sport_label}</div></div><div class="meta"><div class="label">Duración</div><div class="value">${minsToH(w.duration_min)}</div></div><div class="meta"><div class="label">Distancia</div><div class="value">${dist}</div></div></div>
    <div class="meta-grid"><div class="meta"><div class="label">Intensidad</div><div class="value">${w.intensity || '—'}</div></div><div class="meta"><div class="label">Tipo</div><div class="value">${w.session_type || '—'}</div></div><div class="meta"><div class="label">Prioridad</div><div class="value">${w.priority || '—'}</div></div><div class="meta"><div class="label">TSS estimado</div><div class="value">${w.estimated_tss || '—'}</div></div></div>
    ${actualMeta}
    <h3>Detalles</h3><p>${w.details}</p>
    ${w.nutrition ? `<h3>Nutrición</h3><p>${w.nutrition}</p>` : ''}
    ${w.equipment ? `<h3>Material</h3><p>${w.equipment}</p>` : ''}
    ${w.notes ? `<h3>Notas</h3><p>${w.notes}</p>` : ''}
    ${w.actual ? '<p><small>Actividad importada como entrenamiento ya realizado.</small></p>' : `<button class="complete-btn" id="completeModal">${done[w.id]?'Marcar como pendiente':'Marcar como completada'}</button>`}`;
  if (!w.actual) {
    document.getElementById('completeModal').onclick = () => { done[w.id] = !done[w.id]; saveDone(); document.getElementById('modal').classList.remove('open'); render(); };
  }
  document.getElementById('modal').classList.add('open');
}
function populateControls() {
  const monthSelect = document.getElementById('monthSelect');
  monthSelect.innerHTML = '';
  for(let m=0;m<=9;m++) monthSelect.innerHTML += `<option value="${m}">${months[m][0].toUpperCase()+months[m].slice(1)} 2026</option>`;
  monthSelect.value = currentMonth.getMonth();
  const weekSelect = document.getElementById('weekSelect');
  weekSelect.innerHTML = CALENDAR_WEEKS.map(ws => `<option value="${ws}">${weekLabelFromStart(ws)}</option>`).join('');
  weekSelect.value = currentWeek;
  document.getElementById('sportFilter').value = sportFilter;
}
function render() {
  view = document.getElementById('viewSelect').value;
  sportFilter = document.getElementById('sportFilter').value;
  populateControls();
  document.getElementById('topGrid').classList.toggle('week-mode', view === 'week');
  if(view === 'annual') renderAnnual();
  if(view === 'month') renderMonthly();
  if(view === 'week') { renderWeekly(); }
  renderKpis(); attachCards(); attachNavigationShortcuts();
}
document.getElementById('viewSelect').onchange = render;
document.getElementById('sportFilter').onchange = render;
document.getElementById('monthSelect').onchange = e => { currentMonth = new Date(2026, Number(e.target.value), 1); document.getElementById('viewSelect').value = 'month'; render(); };
document.getElementById('weekSelect').onchange = e => { currentWeek = e.target.value; document.getElementById('viewSelect').value = 'week'; render(); };
document.getElementById('prevBtn').onclick = () => {
  if(view==='month') { currentMonth.setMonth(Math.max(0, currentMonth.getMonth()-1)); }
  else if(view==='week') { const i=CALENDAR_WEEKS.indexOf(currentWeek); currentWeek = CALENDAR_WEEKS[Math.max(0, i-1)]; }
  render();
};
document.getElementById('nextBtn').onclick = () => {
  if(view==='month') { currentMonth.setMonth(Math.min(9, currentMonth.getMonth()+1)); }
  else if(view==='week') { const i=CALENDAR_WEEKS.indexOf(currentWeek); currentWeek = CALENDAR_WEEKS[Math.min(CALENDAR_WEEKS.length-1, i+1)]; }
  render();
};
document.getElementById('todayBtn').onclick = () => {
  const now = new Date();
  const today = clampDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()), startDate, endDate);
  currentMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  currentWeek = localIsoDate(mondayOf(today));
  render();
};
document.getElementById('themeBtn').onclick = () => { const body=document.body; const dark=body.getAttribute('data-theme')==='dark'; body.setAttribute('data-theme', dark?'light':'dark'); document.getElementById('themeBtn').textContent = dark?'Modo oscuro':'Modo claro'; };
document.getElementById('clearDoneBtn').onclick = () => { if(confirm('¿Borrar todas las marcas de completado?')) { done={}; saveDone(); render(); } };
document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.remove('open');
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') e.currentTarget.classList.remove('open'); });
render();
</script>
<script>
(function(){
  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(function(err){
        console.warn('No se pudo registrar el service worker:', err);
      });
    });
  }
})();
</script>
